[workspace]
members = [
  "crates/*",
  "packages/babel-plugin-react-compiler-rust/native",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of the React Compiler, vendored from facebook/react by the oxc project."
repository = "https://github.com/oxc-project/oxc-react-compiler"

[workspace.dependencies]
oxc_react_compiler = { version = "0.1.0", path = "crates/oxc_react_compiler" }
oxc_react_compiler_ast = { version = "0.1.0", path = "crates/oxc_react_compiler_ast" }
oxc_react_compiler_diagnostics = { version = "0.1.0", path = "crates/oxc_react_compiler_diagnostics" }
oxc_react_compiler_e2e_cli = { version = "0.1.0", path = "crates/oxc_react_compiler_e2e_cli" }
oxc_react_compiler_hir = { version = "0.1.0", path = "crates/oxc_react_compiler_hir" }
oxc_react_compiler_inference = { version = "0.1.0", path = "crates/oxc_react_compiler_inference" }
oxc_react_compiler_lowering = { version = "0.1.0", path = "crates/oxc_react_compiler_lowering" }
oxc_react_compiler_napi = { version = "0.1.0", path = "packages/babel-plugin-react-compiler-rust/native" }
oxc_react_compiler_optimization = { version = "0.1.0", path = "crates/oxc_react_compiler_optimization" }
oxc_react_compiler_oxc = { version = "0.1.0", path = "crates/oxc_react_compiler_oxc" }
oxc_react_compiler_reactive_scopes = { version = "0.1.0", path = "crates/oxc_react_compiler_reactive_scopes" }
oxc_react_compiler_ssa = { version = "0.1.0", path = "crates/oxc_react_compiler_ssa" }
oxc_react_compiler_swc = { version = "0.1.0", path = "crates/oxc_react_compiler_swc" }
oxc_react_compiler_typeinference = { version = "0.1.0", path = "crates/oxc_react_compiler_typeinference" }
oxc_react_compiler_utils = { version = "0.1.0", path = "crates/oxc_react_compiler_utils" }
oxc_react_compiler_validation = { version = "0.1.0", path = "crates/oxc_react_compiler_validation" }

