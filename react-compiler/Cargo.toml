[workspace]
members = [
  "crates/*",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Rust port of the React Compiler, vendored from react/react."
repository = "https://github.com/oxc-project/forked-react-compiler"

[workspace.dependencies]
react_compiler = { package = "forked_react_compiler", version = "0.2.0", path = "crates/react_compiler" }
react_compiler_ast = { package = "forked_react_compiler_ast", version = "0.2.0", path = "crates/react_compiler_ast" }
react_compiler_diagnostics = { package = "forked_react_compiler_diagnostics", version = "0.2.0", path = "crates/react_compiler_diagnostics" }
react_compiler_hir = { package = "forked_react_compiler_hir", version = "0.2.0", path = "crates/react_compiler_hir" }
react_compiler_inference = { package = "forked_react_compiler_inference", version = "0.2.0", path = "crates/react_compiler_inference" }
react_compiler_lowering = { package = "forked_react_compiler_lowering", version = "0.2.0", path = "crates/react_compiler_lowering" }
react_compiler_optimization = { package = "forked_react_compiler_optimization", version = "0.2.0", path = "crates/react_compiler_optimization" }
react_compiler_reactive_scopes = { package = "forked_react_compiler_reactive_scopes", version = "0.2.0", path = "crates/react_compiler_reactive_scopes" }
react_compiler_ssa = { package = "forked_react_compiler_ssa", version = "0.2.0", path = "crates/react_compiler_ssa" }
react_compiler_typeinference = { package = "forked_react_compiler_typeinference", version = "0.2.0", path = "crates/react_compiler_typeinference" }
react_compiler_utils = { package = "forked_react_compiler_utils", version = "0.2.0", path = "crates/react_compiler_utils" }
react_compiler_validation = { package = "forked_react_compiler_validation", version = "0.2.0", path = "crates/react_compiler_validation" }

# The crates here are libraries consumed by oxc (which applies its own release
# profile). This profile only affects local release builds in this workspace.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

