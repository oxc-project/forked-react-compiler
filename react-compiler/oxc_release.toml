# Configuration for `cargo release-oxc` (https://github.com/oxc-project/cargo-release-oxc).
# Regenerated by ./codemod on every `just sync`. Run from this directory, e.g.:
#   cargo release-oxc publish --release crates [--dry-run]
# (publishes `forked_react_compiler` + its deps; `publish = false` crates are skipped).
[[releases]]
name = "crates"
root_crate = "forked_react_compiler"
versioned_files = ["Cargo.toml"]
