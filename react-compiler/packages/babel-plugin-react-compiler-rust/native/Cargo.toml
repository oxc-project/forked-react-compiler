[package]
name = "oxc_react_compiler_napi"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of the React Compiler — Node.js native binding. Vendored from facebook/react by the oxc project."

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
oxc_react_compiler = { path = "../../../crates/oxc_react_compiler", version = "0.1.0" }
oxc_react_compiler_ast = { path = "../../../crates/oxc_react_compiler_ast", version = "0.1.0" }
serde = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }

[build-dependencies]
napi-build = "2"
