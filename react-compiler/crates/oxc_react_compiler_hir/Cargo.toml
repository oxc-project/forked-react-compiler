[package]
name = "oxc_react_compiler_hir"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of the React Compiler — high-level IR (HIR) types, environment, and visitors. Vendored from facebook/react by the oxc project."

[dependencies]
oxc_react_compiler_diagnostics = { path = "../oxc_react_compiler_diagnostics", version = "0.1.0" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
