[package]
name = "oxc_react_compiler"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of the React Compiler — entrypoint and compilation pipeline. Vendored from facebook/react by the oxc project."

[dependencies]
oxc_react_compiler_ast = { path = "../oxc_react_compiler_ast", version = "0.1.0" }
oxc_react_compiler_diagnostics = { path = "../oxc_react_compiler_diagnostics", version = "0.1.0" }
oxc_react_compiler_hir = { path = "../oxc_react_compiler_hir", version = "0.1.0" }
oxc_react_compiler_inference = { path = "../oxc_react_compiler_inference", version = "0.1.0" }
oxc_react_compiler_lowering = { path = "../oxc_react_compiler_lowering", version = "0.1.0" }
oxc_react_compiler_optimization = { path = "../oxc_react_compiler_optimization", version = "0.1.0" }
oxc_react_compiler_reactive_scopes = { path = "../oxc_react_compiler_reactive_scopes", version = "0.1.0" }
oxc_react_compiler_ssa = { path = "../oxc_react_compiler_ssa", version = "0.1.0" }
oxc_react_compiler_typeinference = { path = "../oxc_react_compiler_typeinference", version = "0.1.0" }
oxc_react_compiler_validation = { path = "../oxc_react_compiler_validation", version = "0.1.0" }
indexmap = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
