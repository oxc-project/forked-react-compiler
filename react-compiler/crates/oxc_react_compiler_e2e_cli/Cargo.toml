[package]
name = "oxc_react_compiler_e2e_cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust port of the React Compiler — end-to-end test CLI. Vendored from facebook/react by the oxc project."

[[bin]]
name = "react-compiler-e2e"
path = "src/main.rs"

[dependencies]
oxc_react_compiler = { path = "../oxc_react_compiler", version = "0.1.0" }
oxc_react_compiler_ast = { path = "../oxc_react_compiler_ast", version = "0.1.0" }
oxc_react_compiler_swc = { path = "../oxc_react_compiler_swc", version = "0.1.0" }
oxc_react_compiler_oxc = { path = "../oxc_react_compiler_oxc", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
swc_ecma_parser = "35"
swc_ecma_ast = "21"
swc_common = "19"
oxc_parser = "0.121"
oxc_allocator = "0.121"
oxc_span = "0.121"
oxc_semantic = "0.121"
oxc_codegen = "0.121"
oxc_diagnostics = "0.121"
